<!doctype html>
<html lang="ko">
<head>
<title>표지 · 카드뉴스</title>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,700..900&family=DM+Mono:wght@500&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<link rel="stylesheet" href="../cards.css">
</head>
<body>
<!-- 1장 · 표지 (1080×1350). 화제가 9개 이상이면 .card 에 compact 클래스를 더해요 -->
<div class="card s-cover">
  <div class="top">
    <span class="logo">ath<svg viewBox="0 0 24 24"><path d="M12 0C12.8 7 17 11.2 24 12C17 12.8 12.8 17 12 24C11.2 17 7 12.8 0 12C7 11.2 11.2 7 12 0Z"/></svg></span>
    <span class="mono date">2026.11.06 FRI</span>
  </div>
  <div class="pill">오늘의 지구 근황</div>
  <h1>지금 19개국이<br><mark>가장 많이 검색한</mark><br>이야기</h1>
  <ul class="list">
    <li><img class="flag" src="../flags/kr.svg" alt=""><div><span>한국</span><b>연휴 여행 수요</b></div><i class="mono">02</i></li>
    <li><img class="flag" src="../flags/jp.svg" alt=""><div><span>일본</span><b>곰 출몰 주의보</b></div><i class="mono">03</i></li>
    <li><img class="flag" src="../flags/us.svg" alt=""><div><span>미국</span><b>스테이블코인 확산</b></div><i class="mono">04</i></li>
    <li><img class="flag" src="../flags/gb.svg" alt=""><div><span>영국</span><b>할로윈 준비</b></div><i class="mono">05</i></li>
    <li><img class="flag" src="../flags/br.svg" alt=""><div><span>브라질</span><b>축구 대표팀 소집</b></div><i class="mono">06</i></li>
    <li><img class="flag" src="../flags/fr.svg" alt=""><div><span>프랑스</span><b>패션위크 개막</b></div><i class="mono">07</i></li>
    <li><img class="flag" src="../flags/au.svg" alt=""><div><span>호주</span><b>봄 산불 주의</b></div><i class="mono">08</i></li>
    <li><img class="flag" src="../flags/th.svg" alt=""><div><span>태국</span><b>여행자 입국 소식</b></div><i class="mono">09</i></li>
  </ul>
  <div class="foot">
    <span>구글 트렌드 급상승 검색어 기준 · 10장</span>
    <span class="go">넘겨서 보기<span><svg viewBox="0 0 24 24"><path d="M4 12h15M13 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
  </div>
</div>
</body>
</html>
