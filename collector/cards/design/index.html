<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카드뉴스 디자인 미리보기</title>
<style>
  :root { --paper:#F4F1EA; --ink:#121318; --mute:#6B6E78; --s:.36; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#17181D; --ink:#ECEDF0; --mute:#9A9DA8; } }
  :root[data-theme="dark"] { --paper:#17181D; --ink:#ECEDF0; --mute:#9A9DA8; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--paper); color:var(--ink); font:15px/1.6 'Pretendard', system-ui, sans-serif; padding:32px 16px 48px; }
  h1 { font-size:22px; } p { color:var(--mute); margin-top:4px; }
  .grid { margin-top:24px; display:flex; flex-wrap:wrap; gap:24px; }
  figure { width:calc(1080px * var(--s)); }
  .frame { width:calc(1080px * var(--s)); height:calc(1350px * var(--s)); overflow:hidden; border-radius:10px; box-shadow:0 4px 18px rgba(0,0,0,.18); }
  .frame iframe { width:1080px; height:1350px; border:0; transform:scale(var(--s)); transform-origin:0 0; display:block; }
  figcaption { margin-top:8px; font-size:14px; } figcaption a { color:inherit; }
  @media (max-width:420px) { :root { --s:.3; } }
</style>
</head>
<body>
  <h1>카드뉴스 디자인 · 1080 × 1350 (4:5)</h1>
  <p>스타일은 ../cards.css 한 파일에 있어요. 고치면 매일 자동으로 만드는 카드에도 반영돼요. 이름을 누르면 실제 크기로 열려요.</p>
  <div class="grid">
    <figure><div class="frame"><iframe src="cover.html" title="표지" loading="lazy"></iframe></div><figcaption><a href="cover.html">1장 · 표지</a></figcaption></figure>
    <figure><div class="frame"><iframe src="topic-photo.html" title="화제 (사진 있음)" loading="lazy"></iframe></div><figcaption><a href="topic-photo.html">화제 · 사진 있음</a></figcaption></figure>
    <figure><div class="frame"><iframe src="topic.html" title="화제 (사진 없음)" loading="lazy"></iframe></div><figcaption><a href="topic.html">화제 · 사진 없음 (국기 스티커)</a></figcaption></figure>
    <figure><div class="frame"><iframe src="outro.html" title="마지막 장" loading="lazy"></iframe></div><figcaption><a href="outro.html">마지막 장</a></figcaption></figure>
  </div>
</body>
</html>
