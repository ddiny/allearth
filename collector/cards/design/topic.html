<!doctype html>
<html lang="ko">
<head>
<title>화제 (사진 없음) · 카드뉴스</title>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,700..900&family=DM+Mono:wght@500&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<link rel="stylesheet" href="../cards.css">
</head>
<body>
<!-- 2장~ · 나라별 화제 (1080×1350)
     .art 의 --cc / --cc2 는 나라 색이에요. 사진이 있으면 .art 에 has-photo 를 더하고 <img class="photo"> 를 넣어요.
     배지: badge--hot / badge--rising / badge--new / badge--talked -->
<div class="card s-topic">
  <div class="top">
    <div class="who"><img class="flag" src="../flags/jp.svg" alt=""><div><b>일본</b><span class="mono">JAPAN · 도호쿠</span></div></div>
    <span class="count mono">03 / 10</span>
  </div>
  <div class="art" style="--cc:#F3B6CD;--cc2:#7E1F46">
    <div class="pattern"></div>
    <img class="big-flag sticker" src="../flags/jp.svg" alt="">
    <div class="badge badge--hot">HOT</div>
    <div class="chip"># 라이프</div>
  </div>
  <h2><mark>곰 출몰 주의보</mark></h2>
  <p class="short">가을철 곰 출몰 소식에 주의를 당부하는 목소리가 커졌어요.</p>
  <ul class="why">
    <li><i class="mono">01</i>먹이가 부족한 해</li>
    <li><i class="mono">02</i>마을 가까이 출몰</li>
    <li><i class="mono">03</i>지자체 안내 강화</li>
  </ul>
  <div class="foot"><span>출처 Google 트렌드 · Kanto Journal, Harbour Notes · AI 요약</span><span class="handle">@ath.earth</span></div>
</div>
</body>
</html>
