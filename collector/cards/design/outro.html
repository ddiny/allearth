<!doctype html>
<html lang="ko">
<head>
<title>마지막 장 · 카드뉴스</title>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,700..900&family=DM+Mono:wght@500&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<link rel="stylesheet" href="../cards.css">
</head>
<body>
<!-- 마지막 장 (1080×1350). 국기가 9개 이상이면 .card 에 many 클래스를 더해요 -->
<div class="card s-outro">
  <div class="top"><span class="logo">ath<svg viewBox="0 0 24 24"><path d="M12 0C12.8 7 17 11.2 24 12C17 12.8 12.8 17 12 24C11.2 17 7 12.8 0 12C7 11.2 11.2 7 12 0Z"/></svg></span><span class="count mono">10 / 10</span></div>
  <div class="flags">
    <img class="flag sticker" src="../flags/kr.svg" alt=""><img class="flag sticker" src="../flags/jp.svg" alt=""><img class="flag sticker" src="../flags/us.svg" alt=""><img class="flag sticker" src="../flags/gb.svg" alt="">
    <img class="flag sticker" src="../flags/br.svg" alt=""><img class="flag sticker" src="../flags/fr.svg" alt=""><img class="flag sticker" src="../flags/au.svg" alt=""><img class="flag sticker" src="../flags/th.svg" alt="">
  </div>
  <h2>나머지 <mark>11개국</mark> 소식은<br>앱에서 볼 수 있어요</h2>
  <p class="sub">매일 밤 12시(한국 시간)에 새 화제로 바뀌어요.</p>
  <ul class="acts">
    <li><span><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg></span><b>저장하기</b><em>내일 또 보기</em></li>
    <li><span><svg viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg></span><b>공유하기</b><em>친구에게 보내기</em></li>
    <li><span><svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M3 21c0-4 3.2-6.5 7-6.5s7 2.5 7 6.5M19 8v6M16 11h6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span><b>팔로우</b><em>매일 아침 받기</em></li>
  </ul>
  <p class="note">구글 트렌드 급상승 검색어와 관련 뉴스를 AI가 요약했어요. 정확한 내용은 원문 기사로 확인해 주세요.</p>
</div>
</body>
</html>
