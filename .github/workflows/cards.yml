name: 매일 카드뉴스 만들기
# 앱에 노출되는 화제를 앱과 같은 방식(공개 주소·공개 키)으로 읽어 카드를 만들어요 (무료. 키 필요 없음)
# 앱에 실제 데이터가 없으면 카드를 만들지 않아요. 그때는 source 를 trends(구글 트렌드 원문)로 바꿔 실행할 수 있어요.
# 만든 이미지는 cards-images 브랜치에 올라가요. 인스타가 그 공개 주소에서 이미지를 가져가요.
on:
  schedule:
    - cron: '13 22 * * *'      # 매일 22:13 UTC = 한국 시간 아침 7:13
  workflow_dispatch:
    inputs:
      source:
        description: '데이터 출처 (app = 앱에 보이는 화제, trends = 구글 트렌드 원문)'
        type: choice
        options: [app, trends]
        default: app
      count:
        description: '화제 카드 수 (1~18). 8 이하면 자동 게시 가능, 9 이상은 앱에서 직접 올리기용(최대 20장)'
        type: string
        default: '8'
      exclude:
        description: '뺄 나라 코드 (예: JP,US). 비우면 전체'
        type: string
        default: ''
permissions:
  contents: write               # cards-images 브랜치에 이미지를 올리기 위해
concurrency:
  group: cards
  cancel-in-progress: false
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 브라우저와 글꼴 준비
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0 pretendard@1.3.9
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-noto-core
      - name: 카드 만들기
        id: cards
        run: node collector/cards.mjs
        env:
          CARDS_SOURCE: ${{ inputs.source || 'app' }}
          CARDS_COUNT: ${{ inputs.count || '8' }}
          CARDS_EXCLUDE: ${{ inputs.exclude }}
          CARDS_HANDLE: ${{ vars.CARDS_HANDLE }}
      - name: 내려받기용으로 보관
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ steps.cards.outputs.date }}
          path: ${{ steps.cards.outputs.dir }}
          retention-days: 14
      - name: cards-images 브랜치에 올리기 (인스타가 가져갈 공개 주소)
        env:
          DATE: ${{ steps.cards.outputs.date }}
          DIR: ${{ steps.cards.outputs.dir }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="${PUSH_URL:-https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git}"
          rm -rf pub && mkdir -p "pub/$DATE"
          cp "$DIR"/* "pub/$DATE/"
          cd pub
          git init -q -b cards-images
          # 같은 날 다시 만들어도 '이미 올림' 기록은 남겨요 (중복 게시 방지)
          if git fetch -q --depth 1 "$URL" cards-images 2>/dev/null; then
            git show "FETCH_HEAD:$DATE/posted.json" > "$DATE/posted.json" 2>/dev/null || rm -f "$DATE/posted.json"
          fi
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "cards $DATE"
          git push -q -f "$URL" HEAD:cards-images
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/cards-images/$DATE"
          {
            echo "### 미리보기"
            echo "![카드 미리보기]($RAW/preview.jpg)"
            echo
            echo "괜찮으면 [인스타에 올리기](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/publish.yml) → **Run workflow** 를 누르세요."
            echo "미리보기가 안 보이면 저장소가 공개(Public)인지 확인해 주세요."
          } >> "$GITHUB_STEP_SUMMARY"
