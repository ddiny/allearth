name: 매일 화제 수집
# 지금은 자동 실행을 꺼뒀어요. 앱용 AI 요약 데이터를 만들 때만 쓰고, Claude API 키(유료)와 Supabase가 필요해요.
# 인스타 카드뉴스는 이 수집 없이 구글 트렌드에서 바로 만들어요 (cards.yml).
on:
  workflow_dispatch:         # Actions 탭에서 직접 실행할 수도 있어요
    inputs:
      dry_run:
        description: '시험 실행 (저장하지 않고 결과만 보기)'
        type: boolean
        default: true
      only:
        description: '일부 나라만 (예: JP,KR). 비우면 전체'
        type: string
        default: ''
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node collector/collect.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only || '' }}
